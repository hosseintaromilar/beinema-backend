# Beinema on one server: MySQL, the backend, the site, the admin panel and Caddy
# (HTTPS for beinema.ir and admin.beinema.ir). Lives in /opt/beinema on the server.
#
# The three app images are built by GitHub Actions and loaded here over SSH
# (.github/workflows/deploy.yml in each repository), so this server never builds
# anything and never needs Maven, npm or Docker Hub for a deploy.
#
# Secrets are in /opt/beinema/.env (DB_PASSWORD, DB_ROOT_PASSWORD) and
# /opt/beinema/api.env (JWT_SECRET, METIS_API_KEY, ...); both are only on the server.

name: beinema

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: beinema
      MYSQL_USER: beinema
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Tehran
    # small server: a modest buffer pool, no performance schema
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    image: beinema-api:latest
    restart: always
    env_file: api.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/beinema?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: beinema
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      BEINEMA_UPLOAD_DIR: /app/uploads
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g -Duser.timezone=Asia/Tehran -Djava.awt.headless=true
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    image: beinema-web:latest
    restart: always
    environment:
      BACKEND_URL: http://api:8080

  admin:
    image: beinema-admin:latest
    restart: always
    environment:
      BACKEND_URL: http://api:8080

  # outgoing email (sign-up codes and the like): Postfix sends straight to the receivers'
  # servers on port 25 and signs with DKIM. No port is published; only the containers here
  # reach it, on mail:587 (MAIL_HOST/MAIL_PORT/MAIL_TLS in api.env). The DKIM key stays in
  # ./dkim; its public half goes in the DNS as mail._domainkey.beinema.ir.
  mail:
    image: boky/postfix:v4.4.0
    restart: always
    environment:
      ALLOWED_SENDER_DOMAINS: beinema.ir
      POSTFIX_myhostname: mail.beinema.ir
      # the server has no IPv6 route out
      POSTFIX_inet_protocols: ipv4
      DKIM_AUTOGENERATE: "true"
      DKIM_SELECTOR: mail
      TZ: Asia/Tehran
    volumes:
      - ./dkim:/etc/opendkim/keys

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin

volumes:
  db:
  caddy_data:
  caddy_config:
