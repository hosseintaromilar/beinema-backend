# Every push to main deploys the backend to Liara (app name in liara.json).
# Needs the repository secret LIARA_API_TOKEN (Liara console > API access).
name: Deploy to Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          npm i -g @liara/cli@9
          liara deploy --api-token="$LIARA_TOKEN" --no-app-logs
