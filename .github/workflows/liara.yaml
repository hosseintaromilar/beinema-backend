# Every push to main deploys the backend to Liara (app name in liara.json).
# Needs the repository secret LIARA_API_TOKEN (Liara console > API access).
name: Deploy to Liara

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: |
          if [ -z "$LIARA_TOKEN" ]; then echo "::error::The LIARA_API_TOKEN repository secret is not set"; exit 1; fi
          npm i -g @liara/cli@9
          # the error also goes to the run summary, which can be read without opening the logs
          set +e
          liara deploy --api-token="$LIARA_TOKEN" --no-app-logs 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then echo "::error::$(tail -n 8 deploy.log | tr '\n' ' ')"; fi
          exit "$status"
