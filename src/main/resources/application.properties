spring.application.name=coupleAi

# Secrets and per-machine values are NOT in this file; every one of them is an
# environment variable name (the list with explanations is .env.example).
#  - local development: backend/.env.local (git-ignored) is read automatically;
#  - production: the same names are environment variables of the Liara app
#    (backend/.env.production, also git-ignored, is the copy to upload there).
# A real environment variable always wins over .env.local.
spring.config.import=optional:file:./.env.local[.properties]

jwt.secret=${JWT_SECRET}
metis.api-key=${METIS_API_KEY}
melipayamak.api-key=${MELIPAYAMAK_API_KEY:}
beinema.admin-phones=${BEINEMA_ADMIN_PHONES:}
# numbers that log in without an SMS code (the admins who test the system)
beinema.otp-bypass-phones=${BEINEMA_OTP_BYPASS_PHONES:}
# their fixed login code; empty = they sign in with no code at all (local only)
beinema.otp-bypass-code=${BEINEMA_OTP_BYPASS_CODE:}
# signing in with an SMS code; off for now: sign-up and login are by number + password (or Google),
# the number is written down without a code (the bypass numbers above only work while this is on)
beinema.auth.sms-login=${BEINEMA_SMS_LOGIN:false}

app.frontend-base-url=${FRONTEND_URL:http://localhost:3000}
# the public address in links people share (invitations, the blog); our own domain, not the host's
app.frontend-url=${PUBLIC_SITE_URL:https://beinema.ir}
app.invitation-expiry-hours=${INVITATION_EXPIRY_HOURS:72}

melipayamak.api-url=${MELIPAYAMAK_API_URL:https://console.melipayamak.com/api/send/simple}
melipayamak.sender-number=${MELIPAYAMAK_SENDER_NUMBER:50004001816794}

logging.console.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/beinema}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

jwt.expiration=86400000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# Sign in with Google: the OAuth client id from Google Cloud (empty = the button is hidden)
beinema.google.client-id=${GOOGLE_CLIENT_ID:}

metis.base-url=https://api.metisai.ir
metis.couple-workflow-id=2ee4e65c-b805-4f09-aef1-162413561eb9
metis.insight-bot-id=${METIS_INSIGHT_BOT_ID:f2991e55-f5b2-4d50-a0c6-8744205d046d}

# Counselor brain. workflow = the v2 Metis workflow above (unchanged);
# orchestrated = v3: director and voice lanes of beinema.brain.workflow-id, with memory,
# clarifying questions and validation in the backend (docs/architecture/redesign-plan.md).
beinema.brain.mode=${BEINEMA_BRAIN_MODE:workflow}
beinema.brain.workflow-id=9f27a118-8685-4072-8d43-85b509dcf71e
# the other companions, each on its own copy of the v3 workflow:
# couple finance, parenting, before marriage, the families, intimacy
beinema.brain.companion-workflow-ids=5ffd2576-20df-422d-af61-f9d1dfff8d4a,2df79424-556e-4215-92d5-28f51ffaff1f,21f80899-1667-4fe3-8d69-b7e98a7d015c,00f32c71-539e-4b87-871b-5dbb0f7bd59c,2a31c5a8-503a-4590-bb5a-fbb3107278ce
# the ones that work by their own method, not Reality Therapy: all of them
beinema.brain.own-method-workflow-ids=5ffd2576-20df-422d-af61-f9d1dfff8d4a,2df79424-556e-4215-92d5-28f51ffaff1f,21f80899-1667-4fe3-8d69-b7e98a7d015c,00f32c71-539e-4b87-871b-5dbb0f7bd59c,2a31c5a8-503a-4590-bb5a-fbb3107278ce
beinema.brain.recent-messages=16
beinema.brain.voice-recent-messages=6
beinema.brain.max-rule-cards=8
beinema.brain.max-rule-chars=3200
beinema.brain.questions-per-session=10
# The counselor's decision path (three-dot menu in a room): only for these phone numbers
beinema.debug.state-panel-phones=${BEINEMA_STATE_PANEL_PHONES:09914816794,09379736278}
# Development: show the director packet in the chat
beinema.debug.show-director-packet=${BEINEMA_DEBUG_SHOW_DIRECTOR_PACKET:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
beinema.upload.dir=${BEINEMA_UPLOAD_DIR:uploads}

beinema.wallet.top-up-presets=100000,250000,500000,1000000
beinema.agent-plan.default-duration-days=30
beinema.agent-plan.price.7=100000
beinema.agent-plan.price.30=250000
beinema.agent-plan.price.90=500000

beinema.governance.pause-min-seconds=${GOVERNANCE_PAUSE_MIN_SECONDS:30}
beinema.governance.pause-max-seconds=${GOVERNANCE_PAUSE_MAX_SECONDS:300}
beinema.governance.pause-default-seconds=${GOVERNANCE_PAUSE_DEFAULT_SECONDS:45}
beinema.referral.referrer-bonus=50000
beinema.referral.referee-bonus=50000
beinema.referral.daily-cap=10

# Blog: the daily writer (off until BEINEMA_BLOG_DAILY_ENABLED=true) and its pictures
beinema.blog.daily-enabled=${BEINEMA_BLOG_DAILY_ENABLED:false}
beinema.blog.writer-model=deepseek-v4-1-flash-1017
beinema.blog.image-provider=black-forest-labs
beinema.blog.image-model=flux-schnell

# Base style of generated pictures; the admin's description comes in front of it
beinema.images.agent-style=warm friendly portrait of a calm, trustworthy counselor, head and shoulders, soft natural light, muted earthy colors, simple plain warm background, gentle expression, modern editorial illustration, no text, no letters, no watermark
beinema.images.blog-style=warm natural light, soft muted earthy colors, calm and hopeful mood, everyday Iranian home, editorial illustration, no close-up faces, no text, no letters, no words, no watermark
