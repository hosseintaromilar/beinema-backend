spring.application.name=coupleAi

# Secrets and per-machine values are NOT in this file.
#  - local development: copy application-local.properties.example to
#    application-local.properties (git-ignored) and fill it in;
#  - production: set the same keys as environment variables
#    (METIS_API_KEY, JWT_SECRET, SPRING_DATASOURCE_PASSWORD, ...).
spring.config.import=optional:file:./application-local.properties
app.frontend-base-url=${FRONTEND_URL:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:${app.frontend-base-url}}
app.invitation-expiry-hours=${INVITATION_EXPIRY_HOURS:72}

melipayamak.api-url=${MELIPAYAMAK_API_URL:https://console.melipayamak.com/api/send/simple}
melipayamak.sender-number=${MELIPAYAMAK_SENDER_NUMBER:50004001816794}

logging.console.enabled=true

spring.datasource.username=root
spring.datasource.url=jdbc:mysql://localhost:3306/beinema

spring.jpa.hibernate.ddl-auto=update

jwt.expiration=86400000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


metis.base-url=https://api.metisai.ir
metis.couple-workflow-id=2ee4e65c-b805-4f09-aef1-162413561eb9
metis.insight-bot-id=${METIS_INSIGHT_BOT_ID:f2991e55-f5b2-4d50-a0c6-8744205d046d}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
beinema.upload.dir=${BEINEMA_UPLOAD_DIR:uploads}

beinema.wallet.top-up-presets=100000,250000,500000,1000000
beinema.agent-plan.default-duration-days=30
beinema.agent-plan.price.7=100000
beinema.agent-plan.price.30=250000
beinema.agent-plan.price.90=500000

beinema.governance.pause-min-seconds=${GOVERNANCE_PAUSE_MIN_SECONDS:30}
beinema.governance.pause-max-seconds=${GOVERNANCE_PAUSE_MAX_SECONDS:300}
beinema.governance.pause-default-seconds=${GOVERNANCE_PAUSE_DEFAULT_SECONDS:45}
beinema.referral.referrer-bonus=50000
beinema.referral.referee-bonus=50000
beinema.referral.daily-cap=10
